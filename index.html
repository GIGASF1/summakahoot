<style>

<body>
<div id="app"></div>
<script>
/* ================= CONFIG ================= */
const CONFIG = {
  // 1) Paste your Firebase web config object here (see README). null = demo mode (this browser only).
  firebase: null,
  // 2) PIN for the presenter screens (fellows never need it)
  teacherPin: '2468',
  title: 'PCCM Poll',
};

/* ================= STORE ================= */
const Store = (() => {
  if (CONFIG.firebase) {
    firebase.initializeApp(CONFIG.firebase);
    const fs = firebase.firestore();
    // Long polling fallback keeps realtime updates working behind strict corporate proxies.
    try { fs.settings({ experimentalAutoDetectLongPolling: true, ignoreUndefinedProperties: true }); } catch (e) {}
    const D = s => s.exists ? { id: s.id, ...s.data() } : null;
    const C = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
    return {
      mode: 'firebase',
      get: p => fs.doc(p).get().then(D),
      getCol: p => fs.collection(p).get().then(C),
      set: (p, d) => fs.doc(p).set(d, { merge: true }),
      put: (p, d) => fs.doc(p).set(d),
      del: p => fs.doc(p).delete(),
      onDoc: (p, cb) => fs.doc(p).onSnapshot(s => cb(D(s)), e => console.error(e)),
      onCol: (p, cb) => fs.collection(p).onSnapshot(s => cb(C(s)), e => console.error(e)),
    };
  }
  const KEY = 'pccm_poll_local';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const save = d => localStorage.setItem(KEY, JSON.stringify(d));
  const subs = new Set();
  const notify = () => subs.forEach(f => f());
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  const seg = p => p.split('/').length;
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { for (const k in b) { if (isObj(b[k]) && isObj(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const colDocs = (d, p) => Object.keys(d).filter(k => k.startsWith(p + '/') && seg(k) === seg(p) + 1).map(k => ({ id: k.slice(p.length + 1), ...d[k] }));
  const docOf = (d, p) => d[p] ? { id: p.split('/').pop(), ...d[p] } : null;
  return {
    mode: 'local',
    get: async p => docOf(load(), p),
    getCol: async p => colDocs(load(), p),
    set: async (p, x) => { const d = load(); d[p] = merge(d[p] || {}, JSON.parse(JSON.stringify(x))); save(d); notify(); },
    put: async (p, x) => { const d = load(); d[p] = JSON.parse(JSON.stringify(x)); save(d); notify(); },
    del: async p => { const d = load(); delete d[p]; save(d); notify(); },
    onDoc: (p, cb) => { const f = () => cb(docOf(load(), p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    onCol: (p, cb) => { const f = () => cb(colDocs(load(), p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
  };
})();

/* ================= HELPERS ================= */
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameKey = n => String(n).trim().toLowerCase().replace(/\s+/g, ' ');
const docKey = n => nameKey(n).replace(/[^a-z0-9]+/g, '_') || 'anon';
const genCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const LETTERS = 'ABCDEF';
const joinUrl = code => `${location.origin}${location.pathname}#/join/${code}`;
const shortUrl = () => (location.origin + location.pathname).replace(/^https?:\/\//, '').replace(/\/(index\.html)?$/, '');
const pinOK = () => localStorage.getItem('pccm_pin') === CONFIG.teacherPin;
const cardList = s => Object.entries((s && s.cards) || {}).filter(([, c]) => c).map(([id, c]) => ({ id, ...c })).sort((a, b) => a.order - b.order);
const modeBanner = () => Store.mode === 'local' ? `<div class="banner"><b>Demo mode</b> — data stays in this browser only (open a second tab to play the fellow side). Paste your Firebase config into <code>index.html</code> to go live for the whole room.</div>` : '';
function makeQR(el, text, size) { if (!el || !window.QRCode) return; el.innerHTML = ''; new QRCode(el, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); }
function downloadCSV(name, rows) {
  // UTF-8 BOM so Excel opens it with correct characters; CSV opens directly in Excel.
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
}
const splitTags = s => String(s || '').split(/[,;]/).map(t => t.trim()).filter(Boolean);
const newId = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function gptPrompt(topic, n) {
  return `Write ${n || 10} board-style multiple-choice questions for pulmonary and critical care fellows on: ${topic || '[topic]'}.
Mix clinical vignettes and physiology. One best answer each. Output ONLY the questions in exactly this format, no headings, no commentary:

1. [question stem]
A. [option]
B. [option]
C. [option]
D. [option]
Answer: [letter]
Explanation: [1-3 sentences on why, and why the others are wrong]

2. ...`;
}

/* ---- bulk paste parser: numbered stems, lettered options, "Answer: B", optional "Explanation:"; also tab-separated spreadsheet rows ---- */
function parseBulk(raw) {
  const clean = String(raw || '').replace(/\r/g, '').replace(/\*\*|__|`/g, '').replace(/^#+\s*/gm, '').replace(/^[\-\*•]\s+(?=\(?[A-Fa-f]\s*[\.\):\-])/gm, '');
  const lines = clean.split('\n').map(l => l.trim());
  const nonEmpty = lines.filter(Boolean);
  const tabby = nonEmpty.filter(l => (l.match(/\t/g) || []).length >= 2);
  if (tabby.length && tabby.length >= nonEmpty.length * 0.5) return parseTSV(nonEmpty);
  const reQ = /^(?:q(?:uestion)?\s*)?(\d{1,3})\s*[\.\):]\s+(.*)$/i;
  const reQlabel = /^question\s*[:\-–—]\s*(.+)$/i;
  const reOpt = /^\(?([A-Fa-f])\s*[\.\):\-–—]\s*(.+)$/;
  const reAns = /^(?:correct\s+answer|answer|correct|key)\s*[:\-–—]\s*(.*)$/i;
  const reExp = /^(?:explanation|rationale|discussion|teaching\s+point|why)\s*[:\-–—]\s*(.*)$/i;
  const reKeyHead = /^answers?\s*(?:key)?\s*:?$/i;
  const qs = []; let cur = null, field = null, inKey = false; const key = {};
  const push = () => { if (cur && cur.text) qs.push(cur); cur = null; field = null; };
  const start = (text, num) => { push(); cur = { text: text.trim(), num, opts: [], letter: null, answerText: null, explanation: '' }; field = 'text'; };
  for (const line of lines) {
    if (!line) continue;
    if (reKeyHead.test(line)) { inKey = true; push(); continue; }
    if (inKey) {
      const all = [...line.matchAll(/(\d{1,3})\s*[\.\):\-–—]?\s*\(?([A-Fa-f])(?![a-z])/g)];
      if (all.length) { all.forEach(m => key[+m[1]] = m[2].toUpperCase()); continue; }
      inKey = false;
    }
    let m;
    if ((m = line.match(reQ))) { start(m[2], +m[1]); continue; }
    if ((m = line.match(reQlabel))) { start(m[1]); continue; }
    if (cur && (m = line.match(reOpt))) { cur.opts.push({ letter: m[1].toUpperCase(), text: m[2].trim() }); field = 'opt'; continue; }
    if (cur && (m = line.match(reAns))) { const a = m[1].trim(); const lm = a.match(/^\(?([A-Fa-f])(?![a-z0-9])/); if (lm) cur.letter = lm[1].toUpperCase(); else cur.answerText = a; field = 'ans'; continue; }
    if (cur && (m = line.match(reExp))) { cur.explanation = m[1].trim(); field = 'exp'; continue; }
    if (cur && field === 'exp') { cur.explanation += ' ' + line; continue; }
    if (cur && field === 'text') { cur.text += ' ' + line; continue; }
    if (cur && field === 'opt') { cur.opts[cur.opts.length - 1].text += ' ' + line; continue; }
    start(line); // unnumbered question after a finished one
  }
  push();
  return qs.map(q => {
    const letter = q.letter || (q.num && key[q.num]) || null;
    let correct = null;
    if (letter) { const i = q.opts.findIndex(o => o.letter === letter); if (i >= 0) correct = i; }
    else if (q.answerText) { const t = q.answerText.toLowerCase().replace(/[\.\s]+$/, ''); const i = q.opts.findIndex(o => o.text.toLowerCase() === t || o.text.toLowerCase().startsWith(t) || t.startsWith(o.text.toLowerCase())); if (i >= 0) correct = i; }
    const options = q.opts.map(o => o.text);
    const mc = options.length >= 2;
    return { text: q.text.trim(), type: mc ? 'mc' : 'text', options: mc ? options : [], correct: mc ? correct : null, explanation: q.explanation.trim() };
  });
}
function parseTSV(lines) {
  const qs = [];
  for (const l of lines) {
    const c = l.split('\t').map(s => s.trim());
    if (/^question/i.test(c[0]) && c.length > 1) continue; // header row
    if (!c[0]) continue;
    let ai = -1; for (let i = c.length - 1; i >= 1; i--) if (/^[A-Fa-f]$/.test(c[i])) { ai = i; break; }
    let options = [], correct = null, explanation = '';
    if (ai > 0) { const idx = c[ai].toUpperCase().charCodeAt(0) - 65; c.slice(1, ai).forEach((o, i) => { if (o) { if (i === idx) correct = options.length; options.push(o); } }); explanation = c.slice(ai + 1).join(' ').trim(); }
    else options = c.slice(1).filter(Boolean);
    const mc = options.length >= 2;
    qs.push({ text: c[0], type: mc ? 'mc' : 'text', options: mc ? options : [], correct: mc ? correct : null, explanation });
  }
  return qs;
}

/* ---- question bank: every question ever created, with how it performed ---- */
async function bankStats() {
  const stats = {}; const sessions = await Store.getCol('sessions');
  for (const s of sessions) {
    const qs = await Store.getCol(`sessions/${s.id}/questions`), as = await Store.getCol(`sessions/${s.id}/answers`);
    qs.forEach(q => { const st = stats[q.id] = stats[q.id] || { asked: 0, answered: 0, correct: 0 }; st.asked++; as.filter(a => a.qid === q.id).forEach(a => { st.answered++; if (q.correct != null && a.answer === q.correct) st.correct++; }); });
  }
  return stats;
}
async function showBank(ctx) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal wide"><p class="muted">Loading…</p></div>`; document.body.appendChild(ov);
  const close = () => ov.remove();
  let items = (await Store.getCol('bank')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const stats = await bankStats();
  const modal = ov.querySelector('.modal');
  let query = '';
  const shown = () => { const q = query.toLowerCase(); return items.filter(i => !q || (i.text + ' ' + (i.tags || []).join(' ') + ' ' + (i.sessionName || '')).toLowerCase().includes(q)); };
  const renderList = () => {
    const list = shown();

  ov.onclick = async e => {

    else if (act === 'bankdel') { e.preventDefault(); if (!confirm('Remove this question from the bank? (Sessions that already used it keep their copy.)')) return; await Store.del(`bank/${b.dataset.id}`); items = items.filter(i => i.id !== b.dataset.id); renderList(); }
    else if (act === 'bankcsv') {
      const rows = [['id', 'added', 'source session', 'tags', 'type', 'question', 'A', 'B', 'C', 'D', 'E', 'F', 'correct', 'explanation', 'sessions asked', 'answers', '% correct', 'has image']];
      shown().forEach(i => { const st = stats[i.id] || { asked: 0, answered: 0, correct: 0 }; const o = i.options || []; rows.push([i.id, fmtDate(i.createdAt), i.sessionName || '', (i.tags || []).join(', '), i.type === 'mc' ? (i.correct != null ? 'quiz' : 'poll') : 'text', i.text, o[0] || '', o[1] || '', o[2] || '', o[3] || '', o[4] || '', o[5] || '', i.correct != null ? LETTERS[i.correct] : '', i.explanation || '', st.asked, st.answered, i.correct != null && st.answered ? Math.round(100 * st.correct / st.answered) : '', i.image ? 'yes' : '']); });
      downloadCSV('pccm-question-bank.csv', rows);
    }
  };
}
function shrinkImage(file) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const go = (max, q) => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q); };
      let out = go(1400, 0.85); if (out.length > 800000) out = go(1000, 0.75); if (out.length > 800000) out = go(800, 0.6);
      res(out);
    };
    img.src = url;
  });
}
function answerText(q, a) { return q.type === 'mc' ? `${LETTERS[a.answer] || '?'} · ${q.options[a.answer] ?? ''}` : a.answer; }
function scoreRows(questions, answers, people) {
  const m = {};
  (people || []).forEach(p => { m[docKey(p.name)] = { name: p.name, correct: 0, total: 0, text: 0 }; });
  answers.forEach(a => {
    const k = docKey(a.name); m[k] = m[k] || { name: a.name, correct: 0, total: 0, text: 0 };
    const q = questions.find(x => x.id === a.qid); if (!q) return;
    if (q.type === 'text') { m[k].text++; return; }
    if (q.correct == null) return;
    m[k].total++; if (a.answer === q.correct) m[k].correct++;
  });
  return Object.values(m).sort((a, b) => b.correct - a.correct || a.name.localeCompare(b.name));
}

/* ================= FELLOW ================= */
function FellowView(code) {
  const sp = `sessions/${code}`;
  let name = localStorage.getItem('pccm_name') || '';
  let session, q = null, mine = null, activeQ = null, lastKey = '', unsubQ = null, unsubA = null, loaded = false;
  app.className = 'fellow';
  if (!name) nameForm(); else start();

  function nameForm() {
    app.innerHTML = `<div class="wrap"><h1 style="margin-top:40px">${esc(CONFIG.title)}</h1><p class="muted">Session <b>${esc(code)}</b></p>
      <form id="nf"><label>Your name</label><input id="nm" autofocus placeholder="First Last" required maxlength="40" autocomplete="name"><button class="btn primary big">Join</button></form></div>`;
    app.onsubmit = e => { e.preventDefault(); const v = $('#nm').value.trim(); if (!v) return; name = v; localStorage.setItem('pccm_name', name); start(); };
  }
  function start() {
    localStorage.setItem('pccm_last', code);
    Store.set(`${sp}/participants/${docKey(name)}`, { name, seenAt: Date.now() });
    watch(Store.onDoc(sp, s => { session = s; loaded = true; syncQ(); render(); }));
    app.onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return; e.preventDefault();
      const act = b.dataset.act;
      if (act === 'rename') { const v = prompt('Your name', name); if (v && v.trim()) { name = v.trim(); localStorage.setItem('pccm_name', name); lastKey = ''; Store.set(`${sp}/participants/${docKey(name)}`, { name, seenAt: Date.now() }); syncQ(true); render(); } }
      if (act === 'mc') submit(+b.dataset.i);
      if (act === 'pick') pick(b.dataset.id);
    };
    app.onsubmit = e => { e.preventDefault(); if (e.target.id === 'tf') { const v = $('#ta').value.trim(); if (v) submit(v); } };
  }
  function syncQ(force) {
    const id = session && session.state === 'question' ? session.activeQ : null;
    if (id === activeQ && !force) return;
    activeQ = id; q = null; mine = null;
    if (unsubQ) unsubQ(); if (unsubA) unsubA(); unsubQ = unsubA = null;
    if (!id) return;
    unsubQ = Store.onDoc(`${sp}/questions/${id}`, d => { q = d; render(); }); watch(unsubQ);
    unsubA = Store.onDoc(`${sp}/answers/${id}__${docKey(name)}`, d => { mine = d; render(); }); watch(unsubA);
  }
  function submit(answer) {
    if (!q || mine || (session.phase || 'open') !== 'open') return;
    mine = { answer }; render();
    Store.put(`${sp}/answers/${q.id}__${docKey(name)}`, { qid: q.id, name, answer, at: Date.now() });
  }
  function pick(id) {
    const cards = cardList(session); if (cards.some(c => c.byKey === nameKey(name))) return;
    const c = cards.find(c => c.id === id); if (!c || c.by) return;
    Store.set(sp, { cards: { [id]: { by: name, byKey: nameKey(name), at: Date.now() } } });
  }
  function render() {
    if (!loaded) return;
    if (!session) { app.innerHTML = `<div class="wrap center"><h1 style="margin-top:60px">Session ${esc(code)} not found</h1><a class="btn" href="#/">Home</a></div>`; return; }
    const key = JSON.stringify([session.state, session.activeQ, session.phase, session.cards, q, mine && mine.answer, name]);
    if (key === lastKey) return; lastKey = key;
    let body;
    if (session.state === 'question' && q) body = renderQuestion();
    else if (session.state === 'cards') body = renderCards();
    else body = `<div class="center" style="margin-top:60px"><div class="bigcheck">✓</div><h2>You're in, ${esc(name.split(' ')[0])}</h2><p class="muted">Waiting for the next question…</p></div>`;
    app.innerHTML = `<div class="wrap"><div class="topbar"><span>${esc(session.name || code)}</span><span class="muted">${esc(name)} · <a href="#" data-act="rename">change</a></span></div>${body}</div>`;
    const ta = $('#ta'); if (ta) ta.focus();
  }
  function renderQuestion() {
    const phase = session.phase || 'open', answered = !!mine;
    let h = `<div class="qcard">${q.image ? `<img src="${q.image}" alt="">` : ''}<h2>${esc(q.text)}</h2></div>`;
    if (q.type === 'mc') {
      h += `<div class="opts">` + (q.options || []).map((o, i) => {
        let cls = 'opt'; if (answered && mine.answer === i) cls += ' mine';
        if (phase === 'revealed') { if (i === q.correct) cls += ' right'; else if (answered && mine.answer === i) cls += ' wrong'; }
        return `<button class="${cls}" data-act="mc" data-i="${i}" ${answered || phase !== 'open' ? 'disabled' : ''}><span class="ltr">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
      }).join('') + `</div>`;
      if (phase === 'revealed' && q.correct != null) h += (answered ? `<p class="status ${mine.answer === q.correct ? 'ok' : 'bad'}">${mine.answer === q.correct ? 'Correct!' : 'Correct answer: ' + LETTERS[q.correct]}</p>` : `<p class="status">Correct answer: ${LETTERS[q.correct]}</p>`) + (q.explanation ? `<div class="expl">${esc(q.explanation)}</div>` : '');
      else if (phase === 'revealed' && q.explanation) h += `<div class="expl">${esc(q.explanation)}</div>`;
      else if (answered) h += `<p class="status">Answer locked in ✓</p>`;
      else if (phase !== 'open') h += `<p class="status">Answering is closed</p>`;
      else h += `<p class="muted center">Tap an answer</p>`;
    } else {
      if (answered) h += `<div class="mine-text">${esc(mine.answer)}</div><p class="status">Submitted ✓</p>`;
      else if (phase !== 'open') h += `<p class="status">Answering is closed</p>`;
      else h += `<form id="tf"><textarea id="ta" rows="3" placeholder="Type your answer…" required maxlength="500"></textarea><button class="btn primary big">Submit</button></form>`;
    }
    return h;
  }
  function renderCards() {
    const cards = cardList(session);
    if (!cards.length) return `<div class="center" style="margin-top:60px"><h2>Cards coming up…</h2></div>`;
    const my = cards.find(c => c.byKey === nameKey(name));
    let h = my ? `<div class="qcard mycard"><div class="muted">Your card</div><h2>${esc(my.topic)}</h2><p class="muted" style="margin:8px 0 0">Explain it to the group — talk it through or draw it on the board.</p></div>` : `<h2 class="center">Pick a card</h2>`;
    h += `<div class="cardgrid">` + cards.map((c, i) => c.by ? `<div class="pcard up"><div class="topic">${esc(c.topic)}</div><div class="who">${esc(c.by)}</div></div>` : `<button class="pcard down" data-act="pick" data-id="${esc(c.id)}" ${my ? 'disabled' : ''}>${i + 1}</button>`).join('') + `</div>`;
    return h;
  }
}

  buildOpts();

  watch(Store.onDoc(sp, s => { S.session = s; renderHeader(); renderStage(); renderCards(); renderQList(); }));
  watch(Store.onCol(`${sp}/questions`, d => { S.questions = d.sort((a, b) => (a.order || 0) - (b.order || 0)); renderQList(); renderStage(); renderScores(); }));
  watch(Store.onCol(`${sp}/answers`, d => { S.answers = d; renderStage(); renderScores(); }));
  watch(Store.onCol(`${sp}/participants`, d => { S.people = d.sort((a, b) => a.name.localeCompare(b.name)); renderStage(); renderScores(); }));

  const setSession = d => Store.set(sp, d);
  const present = id => setSession({ state: 'question', activeQ: id, phase: 'open' });
  const currentIdx = () => S.session && S.session.state === 'question' ? S.questions.findIndex(q => q.id === S.session.activeQ) : -1;
  const nextQ = () => { const q = S.questions[currentIdx() + 1]; if (q) present(q.id); else if (currentIdx() >= 0) setSession({ state: 'lobby', activeQ: null }); };
  const prevQ = () => { const q = S.questions[currentIdx() - 1]; if (q) present(q.id); };
  // Adds questions to the session and the bank. Reuses ids for bank questions so stats accumulate across sessions.
  async function addQuestions(list, opts = {}) {
    const existing = new Set(S.questions.map(q => q.id)); let n = 0; const base = Date.now();
    for (const [i, q] of list.entries()) {
      const id = q.id && !existing.has(q.id) ? q.id : (q.id && existing.has(q.id) ? null : newId()); if (!id) continue;
      const data = { text: q.text, type: q.type, options: q.options || [], correct: q.correct ?? null, image: q.image || null, explanation: q.explanation || '', tags: q.tags || [] };
      await Store.put(`${sp}/questions/${id}`, { ...data, order: base + i, createdAt: q.createdAt || base + i });
      if (!opts.skipBank) await Store.set(`bank/${id}`, { ...data, createdAt: q.createdAt || base + i, source: code, sessionName: (S.session && S.session.name) || code });
      n++;
    }
    return n;
  }
  const bankCtx = () => ({ has: id => S.questions.some(q => q.id === id), add: list => addQuestions(list, { skipBank: true }) });
  document.onkeydown = e => {
    if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.overlay')) return;
    const s = S.session; if (!s) return; const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); nextQ(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prevQ(); }
    else if (k === ' ' && s.state === 'question') { e.preventDefault(); setSession({ phase: s.phase === 'open' ? 'closed' : 'open' }); }
    else if ((k === 'r' || k === 'R') && s.state === 'question') setSession({ phase: 'revealed' });
    else if (k === 'l' || k === 'L') setSession({ state: 'lobby', activeQ: null });
    else if (k === 'c' || k === 'C') setSession({ state: 'cards' });
    else if (k === 'm' || k === 'M') app.classList.toggle('panel-open');
  };

  /* ---- renders ---- */
  function renderHeader() { if (S.session) { $('#ptitle').textContent = S.session.name || code; document.title = `${S.session.name || code} · ${CONFIG.title}`; } }
  function renderStage() {
    const s = S.session, st = $('#stage'); if (s === undefined) return;
    if (!s) { st.innerHTML = `<h2>Session not found</h2>`; return; }
    if (s.state === 'question' && s.activeQ) { const q = S.questions.find(x => x.id === s.activeQ); st.innerHTML = q ? stageQuestion(q, s) : ''; return; }
    if (s.state === 'cards') { st.innerHTML = stageCards(s); return; }
    st.innerHTML = `<div class="lobby"><div class="url">${esc(shortUrl())}</div><div class="bigcode">${esc(code)}</div><div style="margin:18px 0"><div id="qrbig"></div></div>
      <div class="muted">Scan, enter your name, and wait.</div>
      <div class="chips">${S.people.map(p => `<span class="chip">${esc(p.name)}</span>`).join('') || '<span class="muted">Nobody here yet</span>'}</div></div>`;
    makeQR($('#qrbig'), joinUrl(code), 240);
  }
  function stageQuestion(q, s) {
    const ans = S.answers.filter(a => a.qid === q.id), phase = s.phase || 'open', n = S.people.length, idx = S.questions.findIndex(x => x.id === q.id);
    let results;
    if (q.type === 'mc') {
      const counts = q.options.map((_, i) => ans.filter(a => a.answer === i).length), max = Math.max(1, ...counts), show = phase !== 'open';
      results = `<div class="bars">` + q.options.map((o, i) => `<div class="bar ${phase === 'revealed' && i === q.correct ? 'right' : ''}"><div class="lbl"><span class="ltr">${LETTERS[i]}</span><span>${esc(o)}</span></div><div class="track"><div class="fill" style="width:${show ? counts[i] / max * 100 : 0}%"></div></div><div class="cnt">${show ? counts[i] : ''}</div></div>`).join('') + `</div>`;
    } else {
      results = `<div class="texts">` + ans.sort((a, b) => a.at - b.at).map(a => `<div class="tx"><b>${esc(a.name)}</b>${esc(a.answer)}</div>`).join('') + `</div>`;
    }
    const next = S.questions[idx + 1];
    return `<div class="stageq">${q.image ? `<img class="qimg" src="${q.image}" alt="">` : ''}<h1 class="qtext">${esc(q.text)}</h1>${results}
      ${phase === 'revealed' && q.explanation ? `<div class="expl">${esc(q.explanation)}</div>` : ''}
      <div class="controls"><span class="pill ${phase}">${phase.toUpperCase()}</span><span class="muted"><b>${ans.length}</b> / ${n} answered</span>
      ${phase === 'open' ? `<button class="btn" data-act="phase" data-p="closed">Close &amp; show results</button>` : `<button class="btn" data-act="phase" data-p="open">Reopen</button>`}
      ${q.type === 'mc' && q.correct != null && phase !== 'revealed' ? `<button class="btn" data-act="phase" data-p="revealed">Reveal answer</button>` : ''}
      ${next ? `<button class="btn primary" data-act="present" data-id="${esc(next.id)}">Next ▶</button>` : `<button class="btn" data-act="lobby">Done</button>`}
      <span class="muted">Q ${idx + 1} of ${S.questions.length}</span><span class="hint">→ next · space close/open · R reveal · M panel · clicker works</span></div></div>`;
  }
  function stageCards(s) {
    const cards = cardList(s);
    return `<div class="stagecards"><h1>Pick a card</h1>${cards.length ? '' : '<p class="muted">Add topics under Manage → Cards.</p>'}<div class="cardgrid big">${cards.map((c, i) => c.by ? `<div class="pcard up"><div class="topic">${esc(c.topic)}</div><div class="who">${esc(c.by)}</div></div>` : `<button class="pcard down" data-act="pdraw" data-id="${esc(c.id)}" title="Assign this card to someone">${i + 1}</button>`).join('')}</div></div>`;
  }
  function renderQList() {
    const act = S.session && S.session.state === 'question' ? S.session.activeQ : null;
    $('#qlist').innerHTML = S.questions.length ? S.questions.map((q, i) => `<div class="qi ${q.id === act ? 'active' : ''}"><span class="n">${i + 1}</span><span class="t" title="${esc(q.text)}">${q.image ? '🖼 ' : ''}${esc(q.text)}</span><span class="tag">${q.type === 'mc' ? (q.correct != null ? 'quiz' : 'poll') : 'text'}</span><button class="btn xs primary" data-act="present" data-id="${esc(q.id)}" title="Present">▶</button><button class="btn xs" data-act="edit" data-id="${esc(q.id)}" title="Edit">✎</button><button class="btn xs" data-act="delq" data-id="${esc(q.id)}" title="Delete">✕</button></div>`).join('') : `<p class="muted" style="font-size:14px">No questions yet — add one below.</p>`;
  }
  function renderCards() {
    const cards = cardList(S.session);
    $('#cardlist').innerHTML = cards.map(c => `<div class="qi"><span class="t">${esc(c.topic)}</span>${c.by ? `<span class="tag">${esc(c.by)}</span>` : ''}<button class="btn xs" data-act="delcard" data-id="${esc(c.id)}">✕</button></div>`).join('');
  }
  function renderScores() {
    const rows = scoreRows(S.questions, S.answers, S.people), nQuiz = S.questions.filter(q => q.type === 'mc' && q.correct != null).length;
    $('#scores').innerHTML = `<p class="muted" style="font-size:13px;margin:0 0 6px">${nQuiz} quiz question${nQuiz === 1 ? '' : 's'} · ${S.people.length} joined</p><table><tr><th>Fellow</th><th class="num">Correct</th><th class="num">Answered</th><th class="num">Text</th></tr>${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.correct}</td><td class="num">${r.total}</td><td class="num">${r.text}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No one yet</td></tr>'}</table>`;
  }

  /* ---- question form ---- */
  function buildOpts(vals, correct) {
    const box = $('#optsbox');
    box.innerHTML = Array.from({ length: S.nOpts }, (_, i) => `<div class="optrow"><input type="radio" name="correct" value="${i}" title="Mark as correct" ${correct === i ? 'checked' : ''}><span class="ltr">${LETTERS[i]}</span><input type="text" class="optin" placeholder="Option ${LETTERS[i]}" value="${esc(vals ? vals[i] || '' : '')}"></div>`).join('')
      + `<div class="row" style="font-size:13px;justify-content:space-between"><span class="muted">◉ = correct answer (leave none for a poll)</span>${S.nOpts < 6 ? `<button type="button" class="link" data-act="addopt">+ option</button>` : ''}</div>`;
    box.hidden = $('input[name=qtype]:checked').value !== 'mc';
  }
  function setImage(data) { S.image = data; $('#imgprev').innerHTML = data ? `<img src="${data}" alt=""><button type="button" class="link" data-act="rmimg">remove image</button>` : ''; }
  async function fileToImage(f) { if (f && f.type.startsWith('image/')) setImage(await shrinkImage(f)); }
  function resetForm() {
    S.editing = null; setImage(null); S.nOpts = 4; $('#qtext').value = ''; $('#qexp').value = ''; $('#qtags').value = ''; $('#qformtitle').textContent = 'New question'; $('#cancelbtn').hidden = true; buildOpts();
  }
  function loadForm(q) {
    S.editing = q.id; $('#qtext').value = q.text; $('#qexp').value = q.explanation || ''; $('#qtags').value = (q.tags || []).join(', '); $('#qformtitle').textContent = 'Edit question'; $('#cancelbtn').hidden = false;
    ['questions', 'import', 'cards', 'scores'].forEach(t => $('#tab-' + t).hidden = t !== 'questions'); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'questions'));
    $(`input[name=qtype][value=${q.type}]`).checked = true; S.nOpts = Math.max(4, (q.options || []).length); buildOpts(q.options, q.correct); setImage(q.image || null);
    $('#qtext').focus();
  }
  async function saveForm() {
    const text = $('#qtext').value.trim(); if (!text) return;
    const type = $('input[name=qtype]:checked').value;
    let options = [], correct = null;
    if (type === 'mc') {
      const raw = [...document.querySelectorAll('.optin')].map(i => i.value.trim());
      const chosen = $('input[name=correct]:checked'); const ci = chosen ? +chosen.value : -1;
      raw.forEach((v, i) => { if (v) { if (i === ci) correct = options.length; options.push(v); } });
      if (options.length < 2) { alert('Give at least two options.'); return; }
    }
    const data = { text, type, options, correct, image: S.image || null, explanation: $('#qexp').value.trim(), tags: splitTags($('#qtags').value) };
    if (S.editing) { await Store.set(`${sp}/questions/${S.editing}`, data); await Store.set(`bank/${S.editing}`, data); }
    else await addQuestions([data]);
    resetForm(); $('#qtext').focus();
  }
  /* ---- bulk import ---- */
  let parsed = [];
  function refreshPrompt() { $('#promptbox').value = gptPrompt($('#ptopic').value.trim(), +$('#pnum').value || 10); }
  function previewImport() {
    parsed = parseBulk($('#imptext').value);
    const box = $('#imppreview');
    if (!parsed.length) { box.innerHTML = `<p class="warn">Nothing recognized. Each question needs a stem line (numbered helps), then options like "A. …", then "Answer: B".</p>`; $('#impcount').textContent = ''; return; }
    const noAns = parsed.filter(q => q.type === 'mc' && q.correct == null).length;
    $('#impcount').textContent = `${parsed.length} question${parsed.length === 1 ? '' : 's'} found`;
    box.innerHTML = `<table class="imp"><tr><th>#</th><th>Question</th><th>Type</th><th>Ans</th></tr>${parsed.map((q, i) => `<tr><td>${i + 1}</td><td>${esc(q.text.slice(0, 90))}${q.text.length > 90 ? '…' : ''}${q.explanation ? ' <span class="chipx">expl</span>' : ''}</td><td>${q.type === 'mc' ? q.options.length + ' opts' : 'text'}</td><td class="${q.type === 'mc' && q.correct == null ? 'warn' : ''}">${q.type === 'mc' ? (q.correct != null ? LETTERS[q.correct] : '?') : '–'}</td></tr>`).join('')}</table>
      ${noAns ? `<p class="warn" style="font-size:13px">${noAns} multiple-choice question${noAns === 1 ? ' has' : 's have'} no correct answer marked (they'll run as polls; you can edit them after adding).</p>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn primary" data-act="importadd">Add ${parsed.length} to session</button><button class="btn" data-act="importclear">Clear</button></div>`;
  }

  /* ---- events ---- */
  app.onsubmit = e => { e.preventDefault(); if (e.target.id === 'qform') saveForm(); };
  app.onchange = e => {
    if (e.target.name === 'qtype') $('#optsbox').hidden = e.target.value !== 'mc';
    if (e.target.id === 'qimg') { fileToImage(e.target.files[0]); e.target.value = ''; }
  };
  app.onpaste = e => { const f = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (f && e.target.closest('#qform')) { e.preventDefault(); fileToImage(f.getAsFile()); } };
  $('#qtext').addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); saveForm(); } });
  const drop = $('#drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); fileToImage(e.dataTransfer.files[0]); });

  app.onclick = async e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { S.tab = tab.dataset.tab; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab)); ['questions', 'import', 'cards', 'scores'].forEach(t => $('#tab-' + t).hidden = t !== S.tab); if (S.tab === 'import') { refreshPrompt(); $('#imptext').focus(); } return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'panel') app.classList.toggle('panel-open');
    else if (act === 'lobby') setSession({ state: 'lobby', activeQ: null });
    else if (act === 'cardsmode') setSession({ state: 'cards' });
    else if (act === 'present') present(id);
    else if (act === 'phase') setSession({ phase: b.dataset.p });
    else if (act === 'rename') { const v = prompt('Session name', S.session.name || ''); if (v && v.trim()) setSession({ name: v.trim() }); }
    else if (act === 'edit') loadForm(S.questions.find(q => q.id === id));
    else if (act === 'delq') { if (confirm('Delete this question?')) { await Store.del(`${sp}/questions/${id}`); if (S.editing === id) resetForm(); } }
    else if (act === 'addopt') { const vals = [...document.querySelectorAll('.optin')].map(i => i.value); const c = $('input[name=correct]:checked'); S.nOpts = Math.min(6, S.nOpts + 1); buildOpts(vals, c ? +c.value : null); }
    else if (act === 'cancel') resetForm();
    else if (act === 'rmimg') setImage(null);
    else if (act === 'addcards') {
      const lines = $('#cardtopics').value.split('\n').map(s => s.trim()).filter(Boolean); if (!lines.length) return;
      const base = Date.now(), cards = {}; lines.forEach((t, i) => cards['c' + (base + i).toString(36)] = { topic: t, order: base + i, by: null, byKey: null });
      await setSession({ cards }); $('#cardtopics').value = '';
    }
    else if (act === 'delcard') setSession({ cards: { [id]: null } });
    else if (act === 'resetdraws') { const cards = {}; cardList(S.session).forEach(c => cards[c.id] = { by: null, byKey: null }); setSession({ cards }); }
    else if (act === 'clearcards') { if (confirm('Delete all cards?')) { const cards = {}; cardList(S.session).forEach(c => cards[c.id] = null); setSession({ cards }); } }
    else if (act === 'pdraw') { const who = prompt('Who is presenting this card?'); if (who && who.trim()) setSession({ cards: { [id]: { by: who.trim(), byKey: nameKey(who), at: Date.now() } } }); }
    else if (act === 'csv') {
      const rows = [['name', 'question', 'answer', 'correct']];
      S.questions.forEach(q => S.answers.filter(a => a.qid === q.id).forEach(a => rows.push([a.name, q.text, answerText(q, a), q.type === 'mc' && q.correct != null ? (a.answer === q.correct ? 'yes' : 'no') : ''])));
      downloadCSV(`pccm-poll-${code}.csv`, rows);
    }
    else if (act === 'alltime') showAllTime();
    else if (act === 'bank') showBank(bankCtx());
    else if (act === 'parse') previewImport();
    else if (act === 'importclear') { $('#imptext').value = ''; $('#imppreview').innerHTML = ''; $('#impcount').textContent = ''; parsed = []; }
    else if (act === 'importadd') {
      const tags = splitTags($('#imptags').value); b.disabled = true; b.textContent = 'Adding…';
      const n = await addQuestions(parsed.map(q => ({ ...q, tags })));
      $('#imptext').value = ''; $('#imppreview').innerHTML = `<p class="status ok">Added ${n} question${n === 1 ? '' : 's'}. They're in the Questions tab.</p>`; $('#impcount').textContent = ''; parsed = [];
    }
    else if (act === 'copyprompt') {
      refreshPrompt(); const t = $('#promptbox'); t.select();
      try { await navigator.clipboard.writeText(t.value); $('#copied').textContent = 'Copied — paste it into ChatGPT / OpenEvidence.'; } catch (err) { document.execCommand && document.execCommand('copy'); $('#copied').textContent = 'Selected — press ⌘C / Ctrl+C to copy.'; }
    }
  };
  app.oninput = e => { if (e.target.id === 'ptopic' || e.target.id === 'pnum') refreshPrompt(); };
}

route();
</script>
</body>
</html>
